<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>เจ้าของร้าน</title>
<style>
:root{--bg:#f4f2ee;--card:#fff;--text:#1f1d1a;--muted:#77716a;--line:#e0dbd3;--acc:#d9480f;--ok:#2f855a}
@media (prefers-color-scheme:dark){:root{--bg:#161412;--card:#232020;--text:#f2efea;--muted:#a09a92;--line:#3a3632}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,"Noto Sans Thai",sans-serif}
header{padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.row1{display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-size:18px}
.sm{padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit}
.tabs{display:flex;gap:8px;margin-top:10px}
.tabs button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.wrap{max-width:720px;margin:0 auto;padding:12px}
.login{max-width:360px;margin:60px auto;padding:16px}
.login input{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid var(--line);font:inherit;background:var(--card);color:var(--text)}
.big{width:100%;padding:14px;border:0;border-radius:12px;background:var(--acc);color:#fff;font:inherit;font-size:17px;margin-top:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.tbl{font-size:24px;font-weight:700}.t{color:var(--muted);font-size:13px}
.note{color:#b7791f;font-size:14px;margin:2px 0 4px}
.it{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.it>span:first-child{flex:1}
.it.cancelled>span{text-decoration:line-through;color:var(--muted)}
.chip{font-size:12px;padding:2px 8px;border-radius:10px;background:var(--line)}
.chip.new{background:#fde2d3;color:#9c3a0b}.chip.cooking{background:#fdf0c9;color:#8a5a00}.chip.done,.chip.served{background:#d7f0e0;color:#1f6b45}
.x{border:0;background:none;color:var(--muted);font-size:16px;padding:4px 8px}
.sum{display:flex;justify-content:space-between;font-size:20px;font-weight:700;padding:10px 0 6px;border-top:2px solid var(--line)}
.pay{display:flex;gap:8px}
.pay button{flex:1;padding:12px;border:0;border-radius:10px;color:#fff;font:inherit;font-size:16px}
.cash{background:var(--ok)}.tr{background:#2b6cb0}
.empty,.err{text-align:center;color:var(--muted);padding:40px 0}.err{color:var(--acc)}
.stat{display:flex;gap:10px;margin-bottom:12px}.stat>div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:22px}.stat span{color:var(--muted);font-size:13px}
.pl{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line)}
</style>
</head>
<body>
<div id="app"></div>
<script>
var URL_="https://mbpbblyidqhxfywirpic.supabase.co";
var KEY="sb_publishable_OjyM_tQDyI5j4cL78xcE8A_QtTlYric";
var S=null,tab="open",bills=[],paid=[],seen={},first=true,timer=null,ctx=null;
try{S=JSON.parse(localStorage.getItem("s"))}catch(e){}
document.addEventListener("click",function(){if(!ctx){try{ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ctx&&ctx.resume)ctx.resume()});
function $(h){document.getElementById("app").innerHTML=h}
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML}
function money(n){return Number(n).toLocaleString("th-TH")+" ฿"}
function beep(){if(!ctx)return;try{var o=ctx.createOscillator();o.frequency.value=880;o.connect(ctx.destination);o.start();setTimeout(function(){o.stop()},400)}catch(e){}}
function save(){localStorage.setItem("s",JSON.stringify(S))}
function logout(){S=null;localStorage.removeItem("s");clearInterval(timer);view()}
function refresh(){return fetch(URL_+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:S.refresh_token})}).then(function(r){if(!r.ok){logout();throw new Error("auth")}return r.json()}).then(function(d){S=d;save()})}
function api(path,method,body,retry){
  return fetch(URL_+path,{method:method||"GET",headers:{apikey:KEY,"Content-Type":"application/json",Authorization:"Bearer "+S.access_token},body:body?JSON.stringify(body):undefined}).then(function(r){
    if(r.status===401&&!retry)return refresh().then(function(){return api(path,method,body,true)});
    if(!r.ok)throw new Error(r.status);
    return r.text().then(function(t){return t?JSON.parse(t):null});
  });
}
function view(){
  if(!S){$('<div class="login"><h1>เข้าสู่ระบบเจ้าของร้าน</h1><input id="em" type="email" placeholder="อีเมล" autocapitalize="off"><input id="pw" type="password" placeholder="รหัสผ่าน"><button class="big" onclick="login()">เข้าสู่ระบบ</button><div id="msg" class="err"></div></div>');return}
  shell();
}
function login(){
  var em=document.getElementById("em").value.trim(),pw=document.getElementById("pw").value;
  fetch(URL_+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify({email:em,password:pw})}).then(function(r){if(!r.ok)throw new Error();return r.json()}).then(function(d){S=d;save();view()}).catch(function(){document.getElementById("msg").textContent="อีเมลหรือรหัสผ่านไม่ถูกต้อง"});
}
function shell(){
  $('<header><div class="row1"><h1>เจ้าของร้าน</h1><button class="sm" onclick="logout()">ออก</button></div><div class="tabs"><button id="t1" onclick="setTab(\'open\')">บิลที่เปิดอยู่</button><button id="t2" onclick="setTab(\'sum\')">สรุปวันนี้</button></div></header><div class="wrap" id="list"></div>');
  mark();poll();clearInterval(timer);timer=setInterval(poll,5000);
}
function mark(){document.getElementById("t1").className=tab==="open"?"on":"";document.getElementById("t2").className=tab==="sum"?"on":""}
function setTab(t){tab=t;mark();poll()}
function itemsOf(b){var out=[];(b.orders||[]).forEach(function(o){(o.order_items||[]).forEach(function(i){out.push(i)})});return out}
function total(items){var t=0;items.forEach(function(i){if(i.status!=="cancelled")t+=i.price*i.qty});return t}
function ago(t){var m=Math.floor((Date.now()-new Date(t))/60000);return m<1?"เมื่อสักครู่":m<60?m+" นาทีที่แล้ว":Math.floor(m/60)+" ชม. "+(m%60)+" นาทีที่แล้ว"}
function poll(){
  api("/rest/v1/bills?select=id,opened_at,tables(label),orders(id,note,created_at,order_items(id,name,price,qty,status))&status=eq.open&order=opened_at.asc").then(function(r){
    var fresh=false;r.forEach(function(b){(b.orders||[]).forEach(function(o){if(!seen[o.id]){seen[o.id]=1;if(!first)fresh=true}})});
    if(fresh)beep();first=false;bills=r;
    if(tab==="sum"){return todayPaid()}
    draw();
  }).catch(function(){var l=document.getElementById("list");if(l&&S)l.insertAdjacentHTML("afterbegin",'<div class="err">เชื่อมต่อไม่ได้ กำลังลองใหม่…</div>')});
}
function todayPaid(){
  var d=new Date();d.setHours(0,0,0,0);
  return api("/rest/v1/bills?select=id,paid_at,discount,paid_method,tables(label),orders(order_items(price,qty,status))&status=eq.paid&paid_at=gte."+encodeURIComponent(d.toISOString())+"&order=paid_at.desc").then(function(r){paid=r;drawSum()});
}
var ST={"new":"รอทำ","cooking":"กำลังทำ","done":"ทำเสร็จ","served":"เสิร์ฟแล้ว","cancelled":"ยกเลิก"};
function draw(){
  if(tab!=="open")return;
  var l=document.getElementById("list");if(!l)return;
  if(!bills.length){l.innerHTML='<div class="empty">ยังไม่มีโต๊ะที่เปิดบิล</div>';return}
  var h="";
  bills.forEach(function(b,bi){
    var os=(b.orders||[]).slice().sort(function(a,c){return new Date(a.created_at)-new Date(c.created_at)});
    h+='<div class="card"><div class="top"><span class="tbl">โต๊ะ '+esc((b.tables||{}).label)+'</span><span class="t">เปิดบิล '+ago(b.opened_at)+'</span></div>';
    os.forEach(function(o){
      if(o.note)h+='<div class="note">หมายเหตุ: '+esc(o.note)+'</div>';
      (o.order_items||[]).forEach(function(i){
        h+='<div class="it '+i.status+'"><span>'+esc(i.name)+' × '+i.qty+'</span><span class="chip '+i.status+'">'+(ST[i.status]||i.status)+'</span><span>'+money(i.price*i.qty)+'</span>'+(i.status!=="cancelled"?'<button class="x" onclick="cancelItem(\''+i.id+'\')">✕</button>':'')+'</div>';
      });
    });
    h+='<div class="sum"><span>รวม</span><span>'+money(total(itemsOf(b)))+'</span></div><div class="pay"><button class="cash" onclick="closeBill('+bi+',\'cash\')">ปิดบิล: เงินสด</button><button class="tr" onclick="closeBill('+bi+',\'promptpay\')">ปิดบิล: โอน/พร้อมเพย์</button></div></div>';
  });
  l.innerHTML=h;
}
function drawSum(){
  var l=document.getElementById("list");if(!l||tab!=="sum")return;
  var all=0,cash=0,tr=0;
  var rows=paid.map(function(b){var t=total(itemsOf(b))-(b.discount||0);all+=t;if(b.paid_method==="cash")cash+=t;else tr+=t;return{b:b,t:t}});
  var h='<div class="stat"><div><b>'+money(all)+'</b><span>ยอดขายวันนี้</span></div><div><b>'+paid.length+'</b><span>บิลที่ปิดแล้ว</span></div></div><div class="stat"><div><b>'+money(cash)+'</b><span>เงินสด</span></div><div><b>'+money(tr)+'</b><span>โอน/พร้อมเพย์</span></div></div><div class="card">';
  if(!rows.length)h+='<div class="empty">วันนี้ยังไม่มีบิลที่ปิด</div>';
  rows.forEach(function(x){var d=new Date(x.b.paid_at);h+='<div class="pl"><span>โต๊ะ '+esc((x.b.tables||{}).label)+' · '+d.toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"})+' · '+(x.b.paid_method==="cash"?"เงินสด":"โอน")+'</span><b>'+money(x.t)+'</b></div>'});
  l.innerHTML=h+'</div>';
}
function closeBill(i,method){
  var b=bills[i];if(!b)return;
  var t=total(itemsOf(b));
  if(!confirm("ปิดบิลโต๊ะ "+((b.tables||{}).label)+"\nยอด "+money(t)+"\nชำระด้วย"+(method==="cash"?"เงินสด":"โอน/พร้อมเพย์")))return;
  api("/rest/v1/bills?id=eq."+b.id,"PATCH",{status:"paid",paid_method:method,paid_at:new Date().toISOString()}).then(poll).catch(function(){alert("ปิดบิลไม่สำเร็จ ลองอีกครั้ง")});
}
function cancelItem(id){
  if(!confirm("ยกเลิกรายการนี้?"))return;
  api("/rest/v1/order_items?id=eq."+id,"PATCH",{status:"cancelled"}).then(poll).catch(function(){alert("ยกเลิกไม่สำเร็จ ลองอีกครั้ง")});
}
view();
</script>
</body>
</html>
